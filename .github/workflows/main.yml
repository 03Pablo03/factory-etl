name: CI/CD Pipeline

on:
push:
    		branches: [ master ]
  	pull_request:
  	workflow_dispatch:
jobs:
	build-test-push:
		runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
steps:

    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
